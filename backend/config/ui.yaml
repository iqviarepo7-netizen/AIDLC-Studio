app:
  name: AIDLC Studio
  tagline: Agentic delivery from Jira to pull request

theme:
  bg_primary: "#0d1117"
  bg_secondary: "#161b22"
  bg_tertiary: "#21262d"
  accent: "#22d3ee"
  accent_muted: "#0891b2"
  success: "#4ade80"
  warning: "#fbbf24"
  error: "#f87171"
  text_primary: "#e6edf3"
  text_secondary: "#8b949e"
  border: "#30363d"
  font_sans: "Inter, ui-sans-serif, system-ui, sans-serif"
  font_mono: "JetBrains Mono, ui-monospace, monospace"

stages:
  - id: NEW
    label: Ready
  - id: RUNNING
    label: Running
  - id: ANALYZING
    label: Analyze
  - id: MODEL_RECOMMENDED
    label: Model
  - id: PLANNING
    label: Plan
  - id: IMPLEMENTING
    label: Build
  - id: VALIDATING
    label: Test
  - id: RETRYING
    label: Retry
  - id: AWAITING_REVIEW
    label: Review
  - id: PUBLISHING
    label: Publish
  - id: COMPLETED
    label: Done
  - id: FAILED
    label: Failed
